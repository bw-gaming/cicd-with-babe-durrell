steps:
  # Step 1: Write substitution variables to .env file using Ubuntu
  - name: "ubuntu:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "_GITHUB_TOKEN=${_GITHUB_TOKEN}" >> /workspace/.env
        echo "_SMTP_PASSWORD=${_SMTP_PASSWORD}" >> /workspace/.env
        echo "_REPO_OWNER=${_REPO_OWNER}" >> /workspace/.env
        echo "_REPO_NAME=${_REPO_NAME}" >> /workspace/.env

  # Step 2: Install Python dependencies
  - name: "python:3.10"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install python-dotenv requests

  # Step 3: Execute the Python script directly
  - name: "python:3.10"
    entrypoint: "python"
    args: ["/workspace/github_release.py"]

timeout: "600s"
