steps:
  # Step 1: Write substitution variables to .env file
  - name: "ubuntu:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "_GITHUB_TOKEN=${_GITHUB_TOKEN}" >> /workspace/.env
        echo "_SMTP_PASSWORD=${_SMTP_PASSWORD}" >> /workspace/.env
        echo "_REPO_OWNER=${_REPO_OWNER}" >> /workspace/.env
        echo "_REPO_NAME=${_REPO_NAME}" >> /workspace/.env

  # Step 2: Install dependencies and execute the Python script
  - name: "python:3.10"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install python-dotenv requests
        python /workspace/github_release.py

timeout: "600s"
