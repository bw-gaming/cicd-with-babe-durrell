steps:
  # Step 1: Write substitution variables to .env file using Ubuntu
  - name: "ubuntu:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "_GITHUB_TOKEN=${_GITHUB_TOKEN}" >> /workspace/.env
        echo "_SMTP_PASSWORD=${_SMTP_PASSWORD}" >> /workspace/.env
        echo "_REPO_OWNER=${_REPO_OWNER}" >> /workspace/.env
        echo "_REPO_NAME=${_REPO_NAME}" >> /workspace/.env

  # Step 2: Install Python dependencies using the official Python 3.10 image
  - name: "python:3.10"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install python-dotenv requests smtplib

  # Step 3: Copy your Python script into /workspace
  - name: "gcr.io/cloud-builders/cp"
    args: ["github_release.py", "/workspace/"]

  # (Optional) Step 4: Print the .env file (for debugging only!)
  # - name: "ubuntu:latest"
  #   entrypoint: "bash"
  #   args:
  #     - "-c"
  #     - |
  #       cat /workspace/.env

  # Step 5: Execute the Python script
  - name: "python:3.10"
    entrypoint: "python"
    args: ["/workspace/github_release.py"]

timeout: "600s"
